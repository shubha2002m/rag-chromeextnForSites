<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { width: 380px; height: 560px; display: flex; flex-direction: column; background: #f9f9f9; }

    header {
      background: #4f46e5;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 15px; font-weight: 600; }

    #index-btn {
      background: white;
      color: #4f46e5;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #index-btn:hover { background: #e0e7ff; }
    #index-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      font-size: 11px;
      color: #6b7280;
      padding: 6px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      min-height: 26px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spinner {
      width: 10px; height: 10px;
      border: 2px solid #d1d5db;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 92%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .user {
      background: #4f46e5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .bot {
      background: white;
      color: #111;
      align-self: flex-start;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 3px;
    }
    .bot.error { border-color: #fca5a5; background: #fff1f1; color: #b91c1c; }

    .sources {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      color: #6b7280;
    }
    .sources strong { display: block; margin-bottom: 4px; }
    .sources a {
      color: #4f46e5;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .sources a:hover { text-decoration: underline; }

    .thinking {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 10px 13px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      border-bottom-left-radius: 3px;
      align-self: flex-start;
    }
    .thinking span {
      width: 6px; height: 6px;
      background: #d1d5db;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); background: #d1d5db; }
      40% { transform: translateY(-5px); background: #4f46e5; }
    }

    #input-area {
      display: flex;
      padding: 10px;
      gap: 8px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }
    #question {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      resize: none;
      line-height: 1.4;
    }
    #question:focus { border-color: #4f46e5; }
    #send-btn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      align-self: flex-end;
    }
    #send-btn:hover { background: #4338ca; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Docs Chat</h1>
    <button id="index-btn">Index this site</button>
  </header>

  <div id="status">
    <div class="spinner" id="spinner"></div>
    <span id="status-text">Ready — index a site to begin.</span>
  </div>

  <div id="messages">
    <div class="msg bot">
      Hi! Click <strong>"Index this site"</strong> to crawl the current docs page, then ask me anything about it.
    </div>
  </div>

  <div id="input-area">
    <textarea id="question" rows="2" placeholder="Ask a question... (Enter to send)"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
